
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Sketchbook</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #111;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 24px;
      color: white;
      background: #111;
      text-align: center;
    }

    #start-button {
      padding: 14px 24px;
      border: 0;
      border-radius: 30px;
      font-size: 16px;
    }

    #hint {
      position: fixed;
      z-index: 1001;
      bottom: 20px;
      left: 0;
      right: 0;
      color: white;
      text-align: center;
      text-shadow: 0 1px 4px black;
      pointer-events: none;
    }

    .a-enter-vr, .a-enter-ar {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="start-screen">
    <h1>AR Sketchbook</h1>
    <p>Allow camera access, then point your phone at the sketchbook page.</p>
    <button id="start-button">Start AR</button>
    <p id="status">Ready</p>
  </div>

  <div id="hint">Point your camera at the page</div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: true; maxTrack: 1"
    color-space="sRGB"
    renderer="alpha: true, colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="video1"
        src="./assets/animation-video-1.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        muted>
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity id="target1" mindar-image-target="targetIndex: 0">
      <a-video
        id="plane1"
        src="#video1"
        width="1"
        height="0.66"
        position="0 0 0.02">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("#ar-scene");
    const startScreen = document.querySelector("#start-screen");
    const startButton = document.querySelector("#start-button");
    const status = document.querySelector("#status");
    const video = document.querySelector("#video1");
    const target = document.querySelector("#target1");

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      status.textContent = "Starting camera...";

      try {
        await scene.systems["mindar-image-system"].start();
        startScreen.style.display = "none";
      } catch (error) {
        console.error(error);
        status.textContent =
          "Camera failed. Check camera permission and reload.";
        startButton.disabled = false;
      }
    });

    target.addEventListener("targetFound", async () => {
      try {
        await video.play();
      } catch (error) {
        status.textContent = "Tap the screen to start video.";
      }
    });

    target.addEventListener("targetLost", () => {
      video.pause();
    });

    document.body.addEventListener("click", async () => {
      if (!video.paused) return;
      try {
        await video.play();
      } catch (error) {
        console.log("Video playback needs another tap.");
      }
    });
  </script>
</body>
</html>
