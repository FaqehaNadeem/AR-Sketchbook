
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AR Sketchbook</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #sound-button {
      position: fixed;
      z-index: 9999;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border: none;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <button id="sound-button">Enable sound</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="animation" src="./assets/animation.gif">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-plane
        id="gif-plane"
        src="#animation"
        width="1"
        height="0.66"
        position="0 0 0.02"
        material="shader: flat; transparent: true; side: double"
        gif-refresh>
      </a-plane>

    </a-entity>
  </a-scene>

  <audio
    id="track"
    src="./assets/track.mp3"
    preload="auto"
    loop>
  </audio>

  <script>
    // Keep animated GIF frames updating as a WebGL texture.
    AFRAME.registerComponent("gif-refresh", {
      tick: function () {
        const mesh = this.el.getObject3D("mesh");
        if (mesh && mesh.material && mesh.material.map) {
          mesh.material.map.needsUpdate = true;
        }
      }
    });

    const target = document.querySelector("#target");
    const audio = document.querySelector("#track");
    const button = document.querySelector("#sound-button");

    let soundEnabled = false;
    let targetVisible = false;

    button.addEventListener("click", async () => {
      try {
        // Unlock audio playback following a user gesture.
        await audio.play();
        audio.pause();
        audio.currentTime = 0;

        soundEnabled = true;
        button.textContent = "Sound enabled";

        if (targetVisible) {
          await audio.play();
        }
      } catch (error) {
        button.textContent = "Tap to enable sound again";
      }
    });

    target.addEventListener("targetFound", () => {
      targetVisible = true;

      if (soundEnabled) {
        audio.currentTime = 0;
        audio.play().catch(console.error);
      }
    });

    target.addEventListener("targetLost", () => {
      targetVisible = false;
      audio.pause();
      audio.currentTime = 0;
    });
  </script>
</body>
</html>
