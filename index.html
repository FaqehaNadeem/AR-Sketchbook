<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Sketchbook</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #start-screen {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 14px; padding: 24px;
      color: white; text-align: center; background: #111;
    }
    #start-screen p { max-width: 28rem; line-height: 1.5; }
    #start-button { border: 0; border-radius: 999px; padding: 14px 24px; font-size: 16px; font-weight: 650; }
    #hint { position: fixed; z-index: 10; left: 12px; right: 12px; bottom: 18px; text-align: center;
      color: white; text-shadow: 0 1px 4px #000; pointer-events: none; font-size: 14px; }
    #status { font-size: 12px; opacity: .8; }
    .a-enter-vr, .a-enter-ar { display: none !important; }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <div id="start-screen">
    <h1>AR Sketchbook</h1>
    <p>Tap to start, allow camera access, then point your camera at the printed sketchbook spread.</p>
    <button id="start-button">Start AR</button>
    <div id="status">Prototype: spread 1</div>
  </div>
  <div id="hint">Point your camera at the sketchbook spread</div>

  <!--
    PROTOTYPE: targets.mind should contain target-image-1 only.
    For all seven spreads, compile all 7 target images into ONE targets.mind file
    in this order, then uncomment targets 2-7 below. Target indices start at 0.
  -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: true; maxTrack: 1"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <video id="video1" src="./assets/animation-video-1.mp4" preload="auto"
        loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      <!-- Add these video elements when expanding to all seven spreads:
      <video id="video2" src="./assets/animation-video-2.mp4" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      <video id="video3" src="./assets/animation-video-3.mp4" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      <video id="video4" src="./assets/animation-video-4.mp4" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      <video id="video5" src="./assets/animation-video-5.mp4" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      <video id="video6" src="./assets/animation-video-6.mp4" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      <video id="video7" src="./assets/animation-video-7.mp4" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
      -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- The video plane is positioned at positive Z, in front of the tracked target.
         Change height to match the aspect ratio of your spread. -->
    <a-entity id="target1" mindar-image-target="targetIndex: 0">
      <a-video id="plane1" src="#video1" width="1" height="0.66"
        position="0 0 0.015" rotation="0 0 0"></a-video>
    </a-entity>

    <!-- Add these target entities for the seven-target version, keeping target indices
         aligned with the order used when compiling targets.mind:
    <a-entity mindar-image-target="targetIndex: 1"><a-video src="#video2" width="1" height="0.66" position="0 0 0.015"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"><a-video src="#video3" width="1" height="0.66" position="0 0 0.015"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"><a-video src="#video4" width="1" height="0.66" position="0 0 0.015"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"><a-video src="#video5" width="1" height="0.66" position="0 0 0.015"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"><a-video src="#video6" width="1" height="0.66" position="0 0 0.015"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 6"><a-video src="#video7" width="1" height="0.66" position="0 0 0.015"></a-video></a-entity>
    -->
  </a-scene>

  <script>
    const startScreen = document.getElementById('start-screen');
    const startButton = document.getElementById('start-button');
    const sceneEl = document.getElementById('ar-scene');
    const statusEl = document.getElementById('status');
    const video1 = document.getElementById('video1');
    let started = false;
    let targetVisible = false;

    // Start camera only after the visitor taps, improving mobile browser compatibility.
    startButton.addEventListener('click', async () => {
      if (started) return;
      started = true;
      startButton.disabled = true;
      startButton.textContent = 'Starting camera…';
      try {
        await sceneEl.systems['mindar-image-system'].start();
        startScreen.style.display = 'none';
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Camera did not start. Use HTTPS and allow camera access, then reload.';
        startButton.disabled = false;
        startButton.textContent = 'Try again';
        started = false;
      }
    });

    const target1 = document.getElementById('target1');
    target1.addEventListener('targetFound', async () => {
      targetVisible = true;
      video1.muted = false; // audio is enabled after the visitor's initial tap
      try { await video1.play(); } catch (err) {
        // If the browser blocks audio, tap the screen once more.
        video1.muted = true;
        await video1.play().catch(console.warn);
        statusEl.textContent = 'Tap the video once to enable sound.';
      }
    });
    target1.addEventListener('targetLost', () => {
      targetVisible = false;
      video1.pause();
    });

    // Tap anywhere after scanning to retry playback with sound if mobile Safari blocks it.
    document.body.addEventListener('click', async () => {
      if (started && targetVisible && video1.paused) {
        video1.muted = false;
        await video1.play().catch(() => { video1.muted = true; });
      }
    });
  </script>
</body>
</html>
